services:
  - type: web
    name: ndeyas-shop
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn ndeyas_shop.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ndeyas-db
          property: connectionString

databases:
  - name: ndeyas-db
    databaseName: ndeyas_shop
    plan: free
    ipAllowList: []